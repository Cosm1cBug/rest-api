services:

  api:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - redis
      - mongodb

  worker:
    build: .
    restart: unless-stopped
    command: node workers/scraper.worker.js
    env_file:
      - .env
    depends_on:
      - redis
      - mongodb

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No `ports:` stanza -> only reachable from inside the compose network.
    # If you need access from the host, bind explicitly to 127.0.0.1:
    #   ports: ['127.0.0.1:6379:6379']
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis-data:/data

  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER must be set in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:?MONGO_PASS must be set in .env}
    volumes:
      - mongo-data:/data/db

volumes:
  redis-data:
  mongo-data:
