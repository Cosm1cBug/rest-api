version: '3'

services:
  api:
    build: -
    ports: 
      - '3000-3000'
    env_file:
      - .env
    depends_on:
      - redis
      - mongodb

worker: 
  build: .
  command: node workers/scraper.worker.js
  env_file:
    - .env
  depends_on:
    - redis
    - mongodb

redis:
  image: redis:latest
  ports: 
    - '6379:6379'

mongodb:
  image: mongo:latest
  ports: 
    - '27017:27017'